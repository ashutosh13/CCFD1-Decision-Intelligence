# CCFD1 dashboard assistant proxy. See README.md for setup.
# Secrets are NOT set here. The API key is stored with `npx wrangler secret put ANTHROPIC_API_KEY`.
name = "ccfd1-assistant"
main = "src/index.js"
compatibility_date = "2026-11-05"
# Public URL: https://ccfd1-assistant.ccfd1-dashboard.workers.dev (no per-version preview URLs)
workers_dev = true
preview_urls = false

# Per-IP rate limit counter (20 requests per 10 minutes).
# Create the namespace with:  npx wrangler kv namespace create RATE_LIMIT
# then paste the printed id below. If the binding is missing, the Worker falls back
# to a per-instance in-memory counter (best effort only).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "841e9bd3246e4886999f56172c3e4830"
