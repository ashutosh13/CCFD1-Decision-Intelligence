server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The page asks for config.json to find the assistant; point it at this same server.
  location = /config.json {
    default_type application/json;
    add_header Cache-Control no-store;
    return 200 '{"township":"CCFD1","assistant_url":"/ask"}';
  }

  # Assistant proxy (the key stays in the assistant container, never in the browser).
  location /ask {
    rewrite ^/ask/?(.*)$ /$1 break;
    proxy_pass http://assistant:8787;
    proxy_set_header Origin "http://localhost:8000";
    proxy_read_timeout 120s;
  }

  location / { try_files $uri $uri/ =404; }
}
